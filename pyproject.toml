[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emotisense"
version = "0.1.0"
description = "Hybrid journal emotion analysis (Hugging Face API + keyword fallback)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7", "seaborn>=0.12"]
app = ["streamlit>=1.30"]
dev = ["pytest>=7.4"]

[project.scripts]
emotisense = "emotisense.cli:main"

[tool.setuptools]
packages = ["emotisense"]

[tool.pytest.ini_options]
testpaths = ["tests"]
